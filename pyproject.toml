[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "translationsystem"
version = "2.5.0"
description = "Translation and text sizing system with GUI editor"
requires-python = ">=3.8"
dependencies = [
    "flet>=0.80.0",
]

[project.optional-dependencies]
imaging = ["pillow>=9.0.0"]
